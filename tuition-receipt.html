    <div class="app-shell app-shell--dense app-shell--tuition-receipt">
      <header class="page-header">
        <div>
          <p class="page-kicker">青空塾 管理系统 v2</p>
          <h1>領収書生成</h1>
          <p class="page-subtitle">仅基于已 Cash 确认的学费收入记录生成領収書 PDF。</p>
        </div>
        <div class="header-meta">
          <span class="readonly-pill">本地生成</span>
          <span id="appVersion" class="app-version"></span>
        </div>
      </header>

      <main class="page-main">
        <section id="tuitionReceiptMessageArea" class="message is-hidden" aria-live="polite"></section>

        <section id="tuitionReceiptEditorPanel" class="panel tuition-receipt-editor-panel" aria-labelledby="tuitionReceiptEditorTitle">
          <div class="section-heading">
            <h2 id="tuitionReceiptEditorTitle">領収書来源</h2>
            <p class="section-note">以下内容来自已 Cash 确认的收入记录。本页不支持手动新增或修改收据金额。</p>
          </div>

          <form id="tuitionReceiptForm">
            <div class="tuition-receipt-form-grid">
              <label class="field">
                <span>学生名称 / 宛名</span>
                <input id="receiptStudentName" type="text" autocomplete="off" placeholder="例：山田太郎">
              </label>
              <label class="field">
                <span>Cash 确认金额</span>
                <input id="receiptAmountJpy" type="text" autocomplete="off">
              </label>
              <label class="field">
                <span>项目 / 但し書き</span>
                <input id="receiptItemName" type="text" autocomplete="off" placeholder="例：2026年7月分 授業料として">
              </label>
              <label class="field">
                <span>発行日</span>
                <input id="receiptIssueDate" type="date">
              </label>
              <label class="field">
                <span>領収書番号</span>
                <input id="receiptNumber" type="text" autocomplete="off">
              </label>
              <label class="field">
                <span>支払方法</span>
                <input id="receiptPaymentMethod" type="text" autocomplete="off" placeholder="例：銀行振込 / 現金 / Alipay">
              </label>
              <label class="field">
                <span>発行者名称</span>
                <input id="receiptIssuerName" type="text" autocomplete="off" value="青空進学塾">
              </label>
              <label class="field tuition-receipt-wide-field">
                <span>発行者情報</span>
                <input id="receiptIssuerInfo" type="text" autocomplete="off" placeholder="住所・連絡先など任意">
              </label>
              <label class="field tuition-receipt-wide-field">
                <span>備考</span>
                <textarea id="receiptNote" rows="2" placeholder="任意。領収書下部に表示します。"></textarea>
              </label>
            </div>
          </form>
        </section>

        <section id="tuitionReceiptPreviewPanel" class="panel tuition-receipt-preview-panel" aria-labelledby="tuitionReceiptPreviewTitle">
          <div class="section-heading-row">
            <div>
              <h2 id="tuitionReceiptPreviewTitle">領収書预览</h2>
              <p class="section-note">打印时只输出下方 A4 領収書，不输出来源区。</p>
            </div>
            <div class="table-actions">
              <button id="printTuitionReceiptButton" class="button button-primary" type="button">打印 / 保存 PDF</button>
            </div>
          </div>

          <div id="tuitionReceiptPreview" class="tuition-receipt-preview"></div>
        </section>
      </main>
    </div>

    <script type="module" src="./js/tuition-receipt-app.js?v=p1-b2b-auth-storage-20260810-1"></script>
