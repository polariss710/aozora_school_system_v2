<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>青空塾 管理系统 v2 / 收入记录</title>
    <link rel="stylesheet" href="./css/app.css?v=v2.20.0-lesson-detail-readonly-20260603">
  </head>
  <body>
    <div class="app-shell">
      <header class="page-header">
        <div>
          <p class="page-kicker">青空塾 管理系统 v2</p>
          <h1>收入记录</h1>
          <nav class="page-nav" aria-label="主导航">
            <a href="./index.html">老师工资支付</a>
            <a href="./account.html">账户管理</a>
            <a class="is-active" href="./income.html">收入记录</a>
            <a href="./expense.html">支出记录</a>
            <a href="./reimbursement.html">报销管理</a>
            <a href="./business-entity.html">业务归属</a>
            <a href="./teacher.html">老师管理</a>
            <a href="./wage-rule.html">老师工资规则</a>
            <a href="./student.html">学生管理</a>
            <a href="./subject.html">科目管理</a>
            <a href="./lesson.html">课时管理</a>
            <a href="./settlement.html">学生月度结算</a>
            <a href="./wage.html">老师工资结算</a>
          </nav>
        </div>
        <div class="header-meta">
          <span class="readonly-pill">只读版</span>
          <span id="appVersion" class="app-version"></span>
        </div>
      </header>

      <main class="page-main">
        <section id="incomeMessageArea" class="message is-hidden" aria-live="polite"></section>

        <section class="panel filter-panel" aria-labelledby="incomeFilterTitle">
          <div class="section-heading">
            <h2 id="incomeFilterTitle">筛选</h2>
          </div>

          <form id="incomeFilterForm" class="filter-grid">
            <label class="field month-select-field">
              <span>月份</span>
              <div class="month-select-group">
                <select id="incomeYearFilter" name="year" aria-label="年份"></select>
                <select id="incomeMonthFilter" name="month" aria-label="月份"></select>
              </div>
            </label>

            <label class="field">
              <span>学生</span>
              <select id="incomeStudentSelect" name="studentId">
                <option value="">全部</option>
              </select>
            </label>

            <label class="field">
              <span>业务归属</span>
              <select id="incomeBusinessEntitySelect" name="businessEntityId">
                <option value="">全部</option>
              </select>
            </label>

            <label class="field">
              <span>账户</span>
              <select id="incomeAccountSelect" name="accountId">
                <option value="">全部</option>
              </select>
            </label>

            <label class="field">
              <span>币种</span>
              <select id="incomeCurrencySelect" name="currency">
                <option value="">全部</option>
              </select>
            </label>

            <label class="field">
              <span>收入分类</span>
              <select id="incomeCategorySelect" name="incomeCategory">
                <option value="">全部</option>
              </select>
            </label>

            <label class="field">
              <span>支付方式</span>
              <select id="incomePaymentMethodSelect" name="paymentMethod">
                <option value="">全部</option>
              </select>
            </label>

            <label class="field">
              <span>状态</span>
              <select id="incomeStatusSelect" name="status">
                <option value="">全部</option>
              </select>
            </label>

            <label class="field">
              <span>进入学生结算</span>
              <select id="incomeIncludeSelect" name="includeInSettlement">
                <option value="">全部</option>
                <option value="true">是</option>
                <option value="false">否</option>
              </select>
            </label>

            <label class="field">
              <span>关键字</span>
              <input id="incomeKeywordInput" name="keyword" type="search" autocomplete="off" placeholder="学生 / 业务归属 / 账户 / 分类 / 备注">
            </label>

            <div class="filter-actions income-filter-actions">
              <button class="button button-primary" type="submit">查询</button>
              <button class="button" id="incomeResetButton" type="button">重置</button>
            </div>
          </form>
        </section>

        <section class="panel" aria-labelledby="incomeListTitle">
          <div class="section-heading section-heading-row">
            <div>
              <h2 id="incomeListTitle">收入记录</h2>
              <p class="section-note">本页显示已登记收入记录，只读查看；不代表学生月度结算实时预览，不从结算快照或账户流水反推金额。</p>
            </div>
            <span id="incomeCount" class="record-count">0 条</span>
          </div>

          <div id="incomeLoadingState" class="state-text is-hidden">正在加载收入记录...</div>
          <div id="incomeEmptyState" class="state-text is-hidden">暂无符合条件的收入记录。</div>
          <div class="table-scroll">
            <table class="payment-table income-table">
              <thead>
                <tr>
                  <th>详情</th>
                  <th>收入日期</th>
                  <th>月份</th>
                  <th>结算月份</th>
                  <th>学生</th>
                  <th>业务归属</th>
                  <th>账户</th>
                  <th>收入分类</th>
                  <th>币种</th>
                  <th>原币金额</th>
                  <th>JPY 金额</th>
                  <th>CNY 金额</th>
                  <th>汇率</th>
                  <th>支付方式</th>
                  <th>状态</th>
                  <th>收据状态</th>
                  <th>进入学生结算</th>
                  <th>备注</th>
                  <th>创建时间</th>
                  <th>更新时间</th>
                </tr>
              </thead>
              <tbody id="incomeTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./js/income-app.js?v=v2.20.0-lesson-detail-readonly-20260603"></script>
  </body>
</html>
