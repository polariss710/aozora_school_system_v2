<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>青空塾 管理系统 v2 / 学生管理</title>
    <link rel="stylesheet" href="./css/app.css?v=v2.100.0-student-dialog-field-scope-20260612">
  </head>
  <body>
    <div class="app-shell">
      <header class="page-header">
        <div>
          <p class="page-kicker">青空塾 管理系统 v2</p>
          <h1>学生管理</h1>
          <nav class="page-nav" aria-label="主导航">
            <a href="./index.html">老师工资支付</a>
            <a href="./profit-summary.html">利润分析</a>
            <a href="./account.html">账户管理</a>
            <a href="./income.html">收入记录</a>
            <a href="./expense.html">支出记录</a>
            <a href="./reimbursement.html">报销管理</a>
            <a href="./part-time-work.html">私塾打工</a>
            <a href="./business-entity.html">业务归属</a>
            <a href="./teacher.html">老师管理</a>
            <a href="./wage-rule.html">老师工资规则</a>
            <a class="is-active" href="./student.html">学生管理</a>
            <a href="./subject.html">科目管理</a>
            <a href="./lesson.html">课时管理</a>
            <a href="./settlement.html">学生月度结算</a>
            <a href="./wage.html">老师工资结算</a>
          </nav>
        </div>
        <div class="header-meta">
          <span class="readonly-pill">基础信息可编辑</span>
          <span id="appVersion" class="app-version"></span>
        </div>
      </header>

      <main class="page-main">
        <section id="studentMessageArea" class="message is-hidden" aria-live="polite"></section>

        <section class="panel filter-panel" aria-labelledby="studentFilterTitle">
          <div class="section-heading">
            <h2 id="studentFilterTitle">筛选</h2>
          </div>

          <form id="studentFilterForm" class="filter-grid">
            <label class="field">
              <span>关键字</span>
              <input id="studentKeywordInput" name="keyword" type="search" autocomplete="off" placeholder="姓名 / 编号 / 微信 / 电话 / 目标学校 / 备注">
            </label>

            <label class="field">
              <span>状态</span>
              <select id="studentStatusSelect" name="status">
                <option value="">全部</option>
              </select>
            </label>

            <label class="field">
              <span>课程方向</span>
              <select id="studentCourseTrackSelect" name="courseTrack">
                <option value="">全部</option>
              </select>
            </label>

            <label class="field">
              <span>业务归属</span>
              <select id="studentBusinessEntitySelect" name="businessEntityId">
                <option value="">全部</option>
              </select>
            </label>

            <div class="filter-actions student-filter-actions">
              <button class="button button-primary" type="submit">查询</button>
              <button class="button" id="studentResetButton" type="button">重置</button>
            </div>
          </form>
        </section>

        <section class="panel" aria-labelledby="studentListTitle">
          <div class="section-heading section-heading-row">
            <h2 id="studentListTitle">学生列表</h2>
            <div class="header-meta">
              <span id="studentCount" class="record-count">0 人</span>
              <button class="button button-primary" id="createStudentButton" type="button">新增学生</button>
            </div>
          </div>

          <div id="studentLoadingState" class="state-text is-hidden">正在加载学生...</div>
          <div id="studentEmptyState" class="state-text is-hidden">暂无符合条件的学生。</div>
          <div id="studentGrid" class="student-grid"></div>
        </section>
      </main>
    </div>

    <div id="createStudentProfileDialog" class="dialog-backdrop is-hidden" aria-hidden="true">
      <section class="dialog-panel student-profile-dialog-panel app-dialog--md" role="dialog" aria-modal="true" aria-labelledby="createStudentProfileTitle">
        <div class="section-heading">
          <h2 id="createStudentProfileTitle">新增学生</h2>
          <p class="section-note">仅维护学生基础资料和默认值；不会创建或修改结算、收入、课时、工资或账户流水。</p>
        </div>

        <div id="createStudentProfileError" class="dialog-error is-hidden"></div>

        <label class="field" data-create-student-field="name">
          <span>姓名</span>
          <input id="createStudentNameInput" type="text" autocomplete="off">
        </label>

        <label class="field" data-create-student-field="defaultBusinessEntity">
          <span>默认业务归属</span>
          <select id="createStudentBusinessEntitySelect"></select>
        </label>

        <label class="field" data-create-student-field="courseTrack">
          <span>文理区分</span>
          <select id="createStudentCourseTrackSelect"></select>
        </label>

        <label class="field" data-create-student-field="presetExchangeRate">
          <span>预设汇率</span>
          <input id="createStudentPresetExchangeRateInput" type="number" min="0" step="0.000001" inputmode="decimal">
        </label>

        <label class="field">
          <span>微信</span>
          <input id="createStudentWechatInput" type="text" autocomplete="off">
        </label>

        <label class="field">
          <span>电话</span>
          <input id="createStudentPhoneInput" type="tel" autocomplete="off">
        </label>

        <label class="field">
          <span>入学日期</span>
          <input id="createStudentEntranceDateInput" type="date">
        </label>

        <label class="field student-profile-wide-field" data-create-student-field="targetSchools">
          <span>目标学校（最多 3 个，每行一个）</span>
          <textarea id="createStudentTargetSchoolsInput" rows="3"></textarea>
        </label>

        <label class="field student-profile-wide-field">
          <span>备注</span>
          <textarea id="createStudentNoteInput" rows="3"></textarea>
        </label>

        <div class="dialog-actions">
          <button class="button" id="createStudentCancelButton" type="button">取消</button>
          <button class="button button-primary" id="createStudentSubmitButton" type="button">新增</button>
        </div>
      </section>
    </div>

    <div id="editStudentProfileDialog" class="dialog-backdrop is-hidden" aria-hidden="true">
      <section class="dialog-panel student-profile-dialog-panel app-dialog--md" role="dialog" aria-modal="true" aria-labelledby="editStudentProfileTitle">
        <div class="section-heading">
          <h2 id="editStudentProfileTitle">编辑学生</h2>
          <p class="section-note">仅维护学生基础资料和默认值；不会修改余额、结算、收入、支付请求、课时、工资或账户流水。</p>
        </div>

        <div id="editStudentProfileError" class="dialog-error is-hidden"></div>

        <label class="field" data-edit-student-field="name">
          <span>姓名</span>
          <input id="editStudentNameInput" type="text" autocomplete="off">
        </label>

        <label class="field" data-edit-student-field="defaultBusinessEntity">
          <span>默认业务归属</span>
          <select id="editStudentBusinessEntitySelect"></select>
        </label>

        <label class="field" data-edit-student-field="courseTrack">
          <span>文理区分</span>
          <select id="editStudentCourseTrackSelect"></select>
        </label>

        <label class="field" data-edit-student-field="presetExchangeRate">
          <span>预设汇率</span>
          <input id="editStudentPresetExchangeRateInput" type="number" min="0" step="0.000001" inputmode="decimal">
        </label>

        <label class="field">
          <span>微信</span>
          <input id="editStudentWechatInput" type="text" autocomplete="off">
        </label>

        <label class="field">
          <span>电话</span>
          <input id="editStudentPhoneInput" type="tel" autocomplete="off">
        </label>

        <label class="field">
          <span>入学日期</span>
          <input id="editStudentEntranceDateInput" type="date">
        </label>

        <label class="field student-profile-wide-field" data-edit-student-field="targetSchools">
          <span>目标学校（最多 3 个，每行一个）</span>
          <textarea id="editStudentTargetSchoolsInput" rows="3"></textarea>
        </label>

        <label class="field student-profile-wide-field">
          <span>备注</span>
          <textarea id="editStudentNoteInput" rows="3"></textarea>
        </label>

        <div class="dialog-actions">
          <button class="button" id="editStudentCancelButton" type="button">取消</button>
          <button class="button button-primary" id="editStudentSubmitButton" type="button">保存</button>
        </div>
      </section>
    </div>

    <script type="module" src="./js/student-app.js?v=v2.100.0-student-dialog-field-scope-20260612"></script>
  </body>
</html>
