<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>青空塾 管理系统 v2 / 支付管理</title>
    <link rel="stylesheet" href="./css/app.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="page-header">
        <div>
          <p class="page-kicker">青空塾 管理系统 v2</p>
          <h1>支付管理</h1>
        </div>
        <span class="readonly-pill">只读版</span>
      </header>

      <main class="page-main">
        <section id="messageArea" class="message is-hidden" aria-live="polite"></section>

        <section class="panel filter-panel" aria-labelledby="filterTitle">
          <div class="section-heading">
            <h2 id="filterTitle">筛选</h2>
          </div>

          <form id="filterForm" class="filter-grid">
            <label class="field">
              <span>月份</span>
              <input id="monthInput" name="month" type="month">
            </label>

            <label class="field">
              <span>状态</span>
              <select id="statusSelect" name="status">
                <option value="">全部（默认排除已作废）</option>
                <option value="pending">待支付</option>
                <option value="paid">已支付</option>
                <option value="cancelled">已取消</option>
                <option value="reversed">已撤销</option>
                <option value="void">已作废</option>
              </select>
            </label>

            <label class="field">
              <span>来源类型</span>
              <select id="sourceTypeSelect" name="sourceType">
                <option value="">全部</option>
                <option value="teacher_wage">老师工资</option>
              </select>
            </label>

            <label class="field">
              <span>业务归属</span>
              <select id="businessEntitySelect" name="businessEntityId">
                <option value="">全部</option>
              </select>
            </label>

            <label class="field">
              <span>币种</span>
              <select id="currencySelect" name="currency">
                <option value="">全部</option>
                <option value="JPY">JPY</option>
                <option value="CNY">CNY</option>
              </select>
            </label>

            <div class="filter-actions">
              <button class="button button-primary" type="submit">查询</button>
              <button class="button" id="resetButton" type="button">重置</button>
            </div>
          </form>
        </section>

        <section class="panel" aria-labelledby="summaryTitle">
          <div class="section-heading">
            <h2 id="summaryTitle">汇总</h2>
          </div>
          <div id="summaryGrid" class="summary-grid"></div>
        </section>

        <section class="panel table-panel" aria-labelledby="tableTitle">
          <div class="section-heading section-heading-row">
            <h2 id="tableTitle">支付请求列表</h2>
            <span id="recordCount" class="record-count">0 条</span>
          </div>

          <div id="loadingState" class="state-text is-hidden">正在加载...</div>
          <div id="emptyState" class="state-text is-hidden">暂无符合条件的支付请求。</div>

          <div class="table-scroll">
            <table class="payment-table">
              <thead>
                <tr>
                  <th>月份</th>
                  <th>状态</th>
                  <th>来源类型</th>
                  <th>业务归属</th>
                  <th>对象 / 说明</th>
                  <th>币种</th>
                  <th class="number-cell">金额</th>
                  <th>创建时间</th>
                  <th>支付时间</th>
                  <th>撤销时间</th>
                </tr>
              </thead>
              <tbody id="paymentTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
