<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>青空塾 管理系统 v2 / 老师管理</title>
    <link rel="stylesheet" href="./css/app.css?v=v2.101.0-teacher-dialog-field-scope-20260612">
  </head>
  <body>
    <div class="app-shell">
      <header class="page-header">
        <div>
          <p class="page-kicker">青空塾 管理系统 v2</p>
          <h1>老师管理</h1>
          <nav class="page-nav" aria-label="主导航">
            <a href="./index.html">老师工资支付</a>
                        <a href="./profit-summary.html">利润分析</a>
<a href="./account.html">账户管理</a>
            <a href="./income.html">收入记录</a>
            <a href="./expense.html">支出记录</a>
            <a href="./reimbursement.html">报销管理</a>
            <a href="./part-time-work.html">私塾打工</a>
            <a href="./business-entity.html">业务归属</a>
            <a class="is-active" href="./teacher.html">老师管理</a>
            <a href="./wage-rule.html">老师工资规则</a>
            <a href="./student.html">学生管理</a>
            <a href="./subject.html">科目管理</a>
            <a href="./lesson.html">课时管理</a>
            <a href="./settlement.html">学生月度结算</a>
            <a href="./wage.html">老师工资结算</a>
          </nav>
        </div>
        <div class="header-meta">
          <span class="readonly-pill">基础信息可编辑</span>
          <span id="appVersion" class="app-version"></span>
        </div>
      </header>

      <main class="page-main">
        <section id="teacherMessageArea" class="message is-hidden" aria-live="polite"></section>

        <section class="panel filter-panel" aria-labelledby="teacherFilterTitle">
          <div class="section-heading">
            <h2 id="teacherFilterTitle">筛选</h2>
          </div>

          <form id="teacherFilterForm" class="filter-grid">
            <label class="field">
              <span>关键字</span>
              <input id="teacherKeywordInput" name="keyword" type="search" autocomplete="off" placeholder="姓名 / 科目 / 业务归属 / 支付信息 / 备注">
            </label>

            <label class="field">
              <span>状态</span>
              <select id="teacherStatusSelect" name="status">
                <option value="">全部</option>
              </select>
            </label>

            <label class="field">
              <span>老师分类</span>
              <select id="teacherDepartmentSelect" name="department">
                <option value="">全部</option>
              </select>
            </label>

            <label class="field">
              <span>业务归属</span>
              <select id="teacherBusinessEntitySelect" name="businessEntityId">
                <option value="">全部</option>
              </select>
            </label>

            <div class="filter-actions">
              <button class="button button-primary" type="submit">查询</button>
              <button class="button" id="teacherResetButton" type="button">重置</button>
            </div>
          </form>
        </section>

        <section class="panel" aria-labelledby="teacherListTitle">
          <div class="section-heading section-heading-row">
            <h2 id="teacherListTitle">老师列表</h2>
            <div class="header-meta">
              <span id="teacherCount" class="record-count">0 人</span>
              <button class="button button-primary" id="createTeacherButton" type="button">新增老师</button>
            </div>
          </div>

          <div id="teacherLoadingState" class="state-text is-hidden">正在加载老师...</div>
          <div id="teacherEmptyState" class="state-text is-hidden">暂无符合条件的老师。</div>
          <div id="teacherGrid" class="teacher-grid"></div>
        </section>
      </main>
    </div>

    <div id="createTeacherProfileDialog" class="dialog-backdrop is-hidden" aria-hidden="true">
      <section class="dialog-panel teacher-profile-dialog-panel app-dialog--md" role="dialog" aria-modal="true" aria-labelledby="createTeacherProfileTitle">
        <div class="section-heading">
          <h2 id="createTeacherProfileTitle">新增老师</h2>
          <p class="section-note">仅维护老师资料和默认值；不会创建或修改工资规则、工资快照、支付请求、支出或账户流水。</p>
        </div>

        <div id="createTeacherProfileError" class="dialog-error is-hidden"></div>

        <label class="field" data-create-teacher-field="name">
          <span>姓名</span>
          <input id="createTeacherNameInput" type="text" autocomplete="off">
        </label>

        <label class="field" data-create-teacher-field="department">
          <span>老师分类</span>
          <select id="createTeacherDepartmentSelect"></select>
        </label>

        <label class="field" data-create-teacher-field="defaultSubject">
          <span>默认科目</span>
          <select id="createTeacherSubjectSelect"></select>
        </label>

        <label class="field" data-create-teacher-field="businessEntity">
          <span>默认业务归属</span>
          <select id="createTeacherBusinessEntitySelect"></select>
        </label>

        <label class="field" data-create-teacher-field="status">
          <span>老师状态</span>
          <select id="createTeacherStatusSelect"></select>
        </label>

        <label class="field teacher-profile-wide-field">
          <span>备注</span>
          <textarea id="createTeacherNoteInput" rows="3"></textarea>
        </label>

        <div class="dialog-subsection-heading teacher-profile-wide-field">
          <h3>支付信息 / 人民币</h3>
        </div>

        <label class="field">
          <span>支付宝账号</span>
          <input id="createTeacherAlipayAccountInput" type="text" autocomplete="off">
        </label>

        <label class="field">
          <span>微信账号</span>
          <input id="createTeacherWechatAccountInput" type="text" autocomplete="off">
        </label>

        <div class="dialog-subsection-heading teacher-profile-wide-field">
          <h3>支付信息 / 日元</h3>
        </div>

        <label class="field">
          <span>银行名</span>
          <input id="createTeacherBankNameInput" type="text" autocomplete="off">
        </label>

        <label class="field">
          <span>支店番号</span>
          <input id="createTeacherBankBranchCodeInput" type="text" autocomplete="off">
        </label>

        <label class="field">
          <span>支店名</span>
          <input id="createTeacherBankBranchNameInput" type="text" autocomplete="off">
        </label>

        <label class="field">
          <span>账户番号</span>
          <input id="createTeacherBankAccountNumberInput" type="text" autocomplete="off">
        </label>

        <div class="dialog-actions">
          <button class="button" id="createTeacherCancelButton" type="button">取消</button>
          <button class="button button-primary" id="createTeacherSubmitButton" type="button">新增</button>
        </div>
      </section>
    </div>

    <div id="editTeacherProfileDialog" class="dialog-backdrop is-hidden" aria-hidden="true">
      <section class="dialog-panel teacher-profile-dialog-panel app-dialog--md" role="dialog" aria-modal="true" aria-labelledby="editTeacherProfileTitle">
        <div class="section-heading">
          <h2 id="editTeacherProfileTitle">编辑老师</h2>
          <p class="section-note">仅维护老师资料和默认值；不会修改工资规则、工资快照、支付请求、支出、课时或账户流水。</p>
        </div>

        <div id="editTeacherProfileError" class="dialog-error is-hidden"></div>

        <label class="field" data-edit-teacher-field="name">
          <span>姓名</span>
          <input id="editTeacherNameInput" type="text" autocomplete="off">
        </label>

        <label class="field" data-edit-teacher-field="department">
          <span>老师分类</span>
          <select id="editTeacherDepartmentSelect"></select>
        </label>

        <label class="field" data-edit-teacher-field="defaultSubject">
          <span>默认科目</span>
          <select id="editTeacherSubjectSelect"></select>
        </label>

        <label class="field" data-edit-teacher-field="businessEntity">
          <span>默认业务归属</span>
          <select id="editTeacherBusinessEntitySelect"></select>
        </label>

        <label class="field" data-edit-teacher-field="status">
          <span>老师状态</span>
          <select id="editTeacherStatusSelect"></select>
        </label>

        <label class="field teacher-profile-wide-field">
          <span>备注</span>
          <textarea id="editTeacherNoteInput" rows="3"></textarea>
        </label>

        <div class="dialog-subsection-heading teacher-profile-wide-field">
          <h3>支付信息 / 人民币</h3>
        </div>

        <label class="field">
          <span>支付宝账号</span>
          <input id="editTeacherAlipayAccountInput" type="text" autocomplete="off">
        </label>

        <label class="field">
          <span>微信账号</span>
          <input id="editTeacherWechatAccountInput" type="text" autocomplete="off">
        </label>

        <div class="dialog-subsection-heading teacher-profile-wide-field">
          <h3>支付信息 / 日元</h3>
        </div>

        <label class="field">
          <span>银行名</span>
          <input id="editTeacherBankNameInput" type="text" autocomplete="off">
        </label>

        <label class="field">
          <span>支店番号</span>
          <input id="editTeacherBankBranchCodeInput" type="text" autocomplete="off">
        </label>

        <label class="field">
          <span>支店名</span>
          <input id="editTeacherBankBranchNameInput" type="text" autocomplete="off">
        </label>

        <label class="field">
          <span>账户番号</span>
          <input id="editTeacherBankAccountNumberInput" type="text" autocomplete="off">
        </label>

        <div class="dialog-actions">
          <button class="button" id="editTeacherCancelButton" type="button">取消</button>
          <button class="button button-primary" id="editTeacherSubmitButton" type="button">保存</button>
        </div>
      </section>
    </div>

    <script type="module" src="./js/teacher-app.js?v=v2.101.0-teacher-dialog-field-scope-20260612"></script>
  </body>
</html>
