<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>青空塾 管理系统 v2 / 账户管理</title>
    <link rel="stylesheet" href="./css/app.css?v=v2.24.15-reimbursement-reversal-frontend-20260604">
  </head>
  <body>
    <div class="app-shell">
      <header class="page-header">
        <div>
          <p class="page-kicker">青空塾 管理系统 v2</p>
          <h1>账户管理</h1>
          <nav class="page-nav" aria-label="主导航">
            <a href="./index.html">老师工资支付</a>
                        <a href="./profit-summary.html">利润分析</a>
<a class="is-active" href="./account.html">账户管理</a>
            <a href="./income.html">收入记录</a>
            <a href="./expense.html">支出记录</a>
            <a href="./reimbursement.html">报销管理</a>
            <a href="./business-entity.html">业务归属</a>
            <a href="./teacher.html">老师管理</a>
            <a href="./wage-rule.html">老师工资规则</a>
            <a href="./student.html">学生管理</a>
            <a href="./subject.html">科目管理</a>
            <a href="./lesson.html">课时管理</a>
            <a href="./settlement.html">学生月度结算</a>
            <a href="./wage.html">老师工资结算</a>
          </nav>
        </div>
        <div class="header-meta">
          <span class="readonly-pill">账户调整可用</span>
          <span id="appVersion" class="app-version"></span>
        </div>
      </header>

      <main class="page-main">
        <section id="accountMessageArea" class="message is-hidden" aria-live="polite"></section>

        <section class="panel filter-panel" aria-labelledby="accountFilterTitle">
          <div class="section-heading">
            <h2 id="accountFilterTitle">筛选</h2>
          </div>

          <form id="accountFilterForm" class="filter-grid">
            <label class="field month-select-field">
              <span>月份</span>
              <div class="month-select-group">
                <select id="accountYearFilter" name="year" aria-label="年份"></select>
                <select id="accountMonthFilter" name="month" aria-label="月份"></select>
              </div>
            </label>

            <label class="field">
              <span>账户</span>
              <select id="accountSelect" name="accountId">
                <option value="">全部</option>
              </select>
            </label>

            <label class="field">
              <span>业务归属</span>
              <select id="accountBusinessEntitySelect" name="businessEntityId">
                <option value="">全部</option>
              </select>
            </label>

            <label class="field">
              <span>币种</span>
              <select id="accountCurrencySelect" name="currency">
                <option value="">全部</option>
                <option value="JPY">JPY</option>
                <option value="CNY">CNY</option>
              </select>
            </label>

            <label class="field">
              <span>流水类型</span>
              <select id="transactionTypeSelect" name="transactionType">
                <option value="">全部</option>
              </select>
            </label>

            <div class="filter-actions">
              <button class="button button-primary" type="submit">查询</button>
              <button class="button" id="accountResetButton" type="button">重置</button>
            </div>
          </form>
        </section>

        <section class="panel" aria-labelledby="accountListTitle">
          <div class="section-heading section-heading-row">
            <h2 id="accountListTitle">账户列表</h2>
            <div class="table-actions">
              <button class="button" id="openAccountTransferButton" type="button">账户转账/调拨</button>
              <button class="button button-primary" id="openAccountAdjustmentButton" type="button">账户调整</button>
            </div>
          </div>

          <div id="accountLoadingState" class="state-text is-hidden">正在加载账户...</div>
          <div id="accountEmptyState" class="state-text is-hidden">暂无账户。</div>
          <div id="accountGrid" class="account-grid"></div>
        </section>

        <section class="panel table-panel" aria-labelledby="accountTransactionTitle">
          <div class="section-heading section-heading-row">
            <h2 id="accountTransactionTitle">账户流水</h2>
            <span id="accountTransactionCount" class="record-count">0 条</span>
          </div>

          <div id="accountTransactionLoadingState" class="state-text is-hidden">正在加载流水...</div>
          <div id="accountTransactionEmptyState" class="state-text is-hidden">暂无符合条件的账户流水。</div>

          <div class="table-scroll">
            <table class="payment-table account-transaction-table">
              <thead>
                <tr>
                  <th>详情</th>
                  <th>日期</th>
                  <th>账户</th>
                  <th>业务归属</th>
                  <th>类型</th>
                  <th>币种</th>
                  <th class="number-cell">金额</th>
                  <th class="number-cell">余额</th>
                  <th>说明</th>
                  <th>关联来源</th>
                  <th>创建时间</th>
                </tr>
              </thead>
              <tbody id="accountTransactionTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <div id="accountTransferDialog" class="dialog-backdrop is-hidden" aria-hidden="true">
      <section class="dialog-panel" role="dialog" aria-modal="true" aria-labelledby="accountTransferTitle">
        <div class="section-heading">
          <h2 id="accountTransferTitle">账户转账/调拨</h2>
          <p class="section-note">用于同一业务归属、同一币种的账户间资金调拨，会自动写入双边账户流水。</p>
        </div>

        <div id="accountTransferError" class="dialog-error is-hidden"></div>

        <label class="field" data-account-transfer-field="transferDate">
          <span>转账日期</span>
          <input id="accountTransferDateInput" type="date">
        </label>

        <label class="field" data-account-transfer-field="businessEntity">
          <span>业务归属</span>
          <select id="accountTransferBusinessEntitySelect"></select>
        </label>

        <label class="field" data-account-transfer-field="fromAccount">
          <span>转出账户</span>
          <select id="accountTransferFromAccountSelect"></select>
        </label>

        <label class="field" data-account-transfer-field="toAccount">
          <span>转入账户</span>
          <select id="accountTransferToAccountSelect"></select>
        </label>

        <label class="field" data-account-transfer-field="amount">
          <span>转账金额</span>
          <input id="accountTransferAmountInput" type="number" step="0.01" inputmode="decimal" placeholder="请输入大于 0 的金额">
        </label>

        <div id="accountTransferPreview" class="dialog-summary is-hidden"></div>

        <label class="field" data-account-transfer-field="reason">
          <span>原因</span>
          <input id="accountTransferReasonInput" type="text" autocomplete="off" placeholder="例如：账户间调拨">
        </label>

        <label class="field">
          <span>备注</span>
          <textarea id="accountTransferNoteInput" rows="3"></textarea>
        </label>

        <div class="dialog-actions">
          <button class="button" id="accountTransferCancelButton" type="button">取消</button>
          <button class="button button-primary" id="accountTransferSubmitButton" type="button">保存转账</button>
        </div>
      </section>
    </div>

    <div id="accountAdjustmentDialog" class="dialog-backdrop is-hidden" aria-hidden="true">
      <section class="dialog-panel" role="dialog" aria-modal="true" aria-labelledby="accountAdjustmentTitle">
        <div class="section-heading">
          <h2 id="accountAdjustmentTitle">账户调整</h2>
          <p class="section-note">用于人工修正账户余额，会自动写入账户调整记录和账户流水。</p>
        </div>

        <div id="accountAdjustmentError" class="dialog-error is-hidden"></div>

        <label class="field" data-account-adjustment-field="adjustmentDate">
          <span>调整日期</span>
          <input id="accountAdjustmentDateInput" type="date">
        </label>

        <label class="field" data-account-adjustment-field="businessEntity">
          <span>业务归属</span>
          <select id="accountAdjustmentBusinessEntitySelect"></select>
        </label>

        <label class="field" data-account-adjustment-field="account">
          <span>账户</span>
          <select id="accountAdjustmentAccountSelect"></select>
        </label>

        <label class="field" data-account-adjustment-field="amount">
          <span>调整金额</span>
          <input id="accountAdjustmentAmountInput" type="number" step="0.01" inputmode="decimal" placeholder="正数增加，负数减少">
        </label>

        <div id="accountAdjustmentPreview" class="dialog-summary is-hidden"></div>

        <label class="field" data-account-adjustment-field="reason">
          <span>原因</span>
          <input id="accountAdjustmentReasonInput" type="text" autocomplete="off" placeholder="例如：期初余额修正">
        </label>

        <label class="field">
          <span>备注</span>
          <textarea id="accountAdjustmentNoteInput" rows="3"></textarea>
        </label>

        <div class="dialog-actions">
          <button class="button" id="accountAdjustmentCancelButton" type="button">取消</button>
          <button class="button button-primary" id="accountAdjustmentSubmitButton" type="button">保存调整</button>
        </div>
      </section>
    </div>

    <script type="module" src="./js/account-app.js?v=v2.34.1-account-transfer-reversal-frontend-20260606"></script>
  </body>
</html>
